<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://docs.google.com https://*.googleusercontent.com https://www.googleapis.com; media-src blob:; frame-src https://drive.google.com; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>Worksheet Browser</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <header>
    <div class="title-row">
      <h1 id="title">Worksheet Browser</h1>
      <label class="switch" title="When on, opening a song (clicking its title) loads its MP3 player">
        <input type="checkbox" id="autoplay" role="switch" autocomplete="off">
        <span class="track" aria-hidden="true"></span>
        <span class="switch-label">Auto-play MP3</span>
      </label>
    </div>
    <div id="tabs" role="tablist" aria-label="Sheets"></div>
    <div class="controls">
      <input id="search" type="search" placeholder="Search all columns…" aria-label="Search">
      <select id="columnFilter" aria-label="Search in column"></select>
      <span id="count" aria-live="polite"></span>
    </div>
  </header>

  <main>
    <p id="note">Tap or click a song title to view its lyrics.</p>
    <div id="status" role="status"></div>
    <div class="table-wrap">
      <table id="table">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
    <nav id="pager" aria-label="Pagination">
      <button id="prev">&laquo; Prev</button>
      <span id="pageInfo"></span>
      <button id="next">Next &raquo;</button>
    </nav>
  </main>

  <dialog id="detail">
    <div class="dlg-head">
      <h2 id="detailTitle"></h2>
      <button id="closeDetail" aria-label="Close">&times;</button>
    </div>
    <div id="player" hidden>
      <select id="trackSelect" aria-label="Choose recording" hidden></select>
      <div id="audioMsg" role="status" hidden></div>
      <audio id="audio" controls preload="none" hidden></audio>
      <iframe id="drivePlayer" title="MP3 player (Google Drive)" hidden allow="autoplay"></iframe>
      <div class="player-opts">
        <button type="button" id="loadPlayer">&#9654; Show player</button>
        <a id="driveLink" target="_blank" rel="noopener noreferrer">Open MP3 in Drive</a>
      </div>
    </div>
    <div id="lyrics"></div>
    <dl id="detailBody"></dl>
  </dialog>

  <script src="config.js?v=3"></script>
  <script src="audio-map.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
